name: Capture Windows output

# Real Windows output for the network-plus notes.
#
# The exam names ipconfig, arp, netstat, nslookup and tracert, and the track's
# comparison tables have a Windows column. Neither the podman machine nor the
# namespace tooling can produce any of it, and there is no Windows machine in
# this project, so the honest options were to source that column from
# documentation or to find a real Windows host.
#
# A GitHub Actions windows-latest runner is a real Windows host. It is free on a
# public repository, its image version is published and recorded in the output,
# and the whole capture is a committed script rather than something typed once
# and lost. That makes a Windows transcript reproducible on the same terms as
# the Linux ones.
#
# Deliberately manual. This never runs on push, so it cannot slow a deploy or
# fire on a docs change. Run it when a topic needs Windows output:
#
#   blog/scripts/wincap.sh host-identifiers
#
# What it cannot do: the runner is one machine on GitHub's network with no
# second host to talk to and no control over its own topology. So it captures
# what a Windows host says about itself and about the internet, and anything
# needing two machines stays on the namespace tooling.

on:
  # Dispatch runs one named script. GitHub only exposes workflow_dispatch for
  # workflows that already exist on the default branch, so this route does not
  # work from a feature branch until the workflow has been merged.
  workflow_dispatch:
    inputs:
      steps:
        description: "Script under blog/scripts/windows/ to run, without the .ps1"
        required: true
        default: host-identifiers
        type: string
  # Editing a capture script regenerates every transcript. That makes the
  # captures self-testing on a branch, which is the only way to run them before
  # the workflow reaches the default branch, and it means a changed command can
  # never leave a stale transcript behind unnoticed.
  push:
    paths:
      - ".github/workflows/capture-windows.yml"
      - "blog/scripts/windows/**"

permissions:
  contents: read

jobs:
  capture:
    runs-on: windows-latest
    name: Capture
    steps:
      - uses: actions/checkout@v6

      - name: Run the capture
        id: capture
        shell: pwsh
        env:
          STEPS: ${{ inputs.steps }}
        run: |
          $ErrorActionPreference = 'Continue'

          # A dispatch names one script. A push regenerates all of them.
          if ($env:STEPS) {
            $scripts = @("blog/scripts/windows/$env:STEPS.ps1")
            if (-not (Test-Path $scripts[0])) {
              Write-Error "no capture script at $($scripts[0])"
              exit 1
            }
          } else {
            $scripts = Get-ChildItem "blog/scripts/windows/*.ps1" | ForEach-Object { $_.FullName }
          }

          # Provenance. The runner image version is what pins this transcript,
          # the same way a container digest pins the Linux ones, so it goes in
          # the header rather than in a commit message somebody has to find.
          $os = (Get-CimInstance Win32_OperatingSystem).Caption
          $ver = [System.Environment]::OSVersion.Version.ToString()
          $img = if ($env:ImageVersion) { $env:ImageVersion } else { 'unknown' }

          New-Item -ItemType Directory -Force -Path capture | Out-Null

          foreach ($script in $scripts) {
          $name = [System.IO.Path]::GetFileNameWithoutExtension($script)
          $out = New-Object System.Text.StringBuilder
          [void]$out.AppendLine('```powershell')
          [void]$out.AppendLine("# $os, version $ver")
          [void]$out.AppendLine("# GitHub Actions windows-latest, runner image $img")

          foreach ($line in Get-Content $script) {
            $t = $line.Trim()
            if ($t -eq '') { [void]$out.AppendLine(''); continue }
            if ($t.StartsWith('#')) { [void]$out.AppendLine($t); continue }
            [void]$out.AppendLine("> $t")
            try {
              $result = Invoke-Expression $t 2>&1 | Out-String
            } catch {
              $result = "$_"
            }
            foreach ($r in ($result -split "`r?`n")) {
              if ($r.Trim() -ne '') { [void]$out.AppendLine($r.TrimEnd()) }
            }
          }
          [void]$out.AppendLine('```')
          $out.ToString() | Set-Content -Path "capture/$name.md" -Encoding utf8
          Get-Content "capture/$name.md"
          }

      - name: Upload the transcript
        uses: actions/upload-artifact@v4
        with:
          name: windows-capture${{ inputs.steps && format('-{0}', inputs.steps) || '' }}
          path: capture/
          retention-days: 7
