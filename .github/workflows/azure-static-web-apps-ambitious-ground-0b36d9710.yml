name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  test:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: API Tests
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: api/requirements-dev.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        working-directory: api
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        working-directory: api
        run: pytest -v

  build_and_deploy_job:
    needs: test
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
       id-token: write
       contents: read
       pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          lfs: false
      - name: Install OIDC Client from Core Package
        run: npm install @actions/core@1.6.0 @actions/http-client
      - name: Get Id Token
        uses: actions/github-script@v8
        id: idtoken
        with:
           script: |
               const coredemo = require('@actions/core')
               return await coredemo.getIDToken()
           result-encoding: string
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: blog/package-lock.json

      - name: Build Astro site
        working-directory: blog
        run: |
          npm ci
          # `npm run build` is `astro build` followed by the Pagefind index,
          # so the search index is always produced from the deployed output.
          npm run build

      - name: Run route tests
        working-directory: blog
        run: npm test

      - name: Stage built sections into frontend
        working-directory: blog
        run: |
          # The Astro project builds at base '/' and serves two sections, so
          # copy the sections and shared assets rather than the whole dist.
          cp -r dist/blog ../frontend/
          cp -r dist/learn ../frontend/
          cp -r dist/_astro ../frontend/
          cp -r dist/pagefind ../frontend/
          cp dist/sitemap-*.xml ../frontend/
          # robots.txt has advertised /blog/sitemap-index.xml for a while, so
          # keep that path resolving as well as the new root one.
          cp dist/sitemap-*.xml ../frontend/blog/
          du -sh ../frontend

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AMBITIOUS_GROUND_0B36D9710 }}
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/frontend"
          api_location: "/api"
          output_location: ""
          github_id_token: ${{ steps.idtoken.outputs.result }}
          ###### End of Repository/Build Configurations ######

      # Surface the preview environment URL on the PR itself, so it does not
      # have to be dug out of the build log. Edits one pinned comment in place
      # rather than adding a new one on every push.
      - name: Comment the preview URL on the PR
        if: github.event_name == 'pull_request' && steps.builddeploy.outputs.static_web_app_url != ''
        uses: actions/github-script@v8
        env:
          PREVIEW_URL: ${{ steps.builddeploy.outputs.static_web_app_url }}
        with:
          script: |
            const marker = '<!-- swa-preview-url -->'
            const url = process.env.PREVIEW_URL.replace(/\/$/, '')
            const pages = [
              ['Resume', '/'],
              ['Learn', '/learn'],
              ['Bicep track', '/learn/bicep'],
              ['Bicep topic', '/learn/bicep/modules-and-scopes'],
              ['Practice test', '/learn/security-plus/practice/fundamentals'],
              ['Blog', '/blog'],
            ]
            const body = [
              marker,
              `### Preview environment`,
              ``,
              url,
              ``,
              `| Page | Link |`,
              `| --- | --- |`,
              ...pages.map(([name, path]) => `| ${name} | ${url}${path} |`),
              ``,
              `Built from ${context.sha.slice(0, 7)}. This comment is updated in place on each push.`,
            ].join('\n')

            const { owner, repo } = context.repo
            const issue_number = context.payload.pull_request.number
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number,
            })
            const existing = comments.find((c) => c.body?.includes(marker))

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body })
            }

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Install OIDC Client from Core Package
        run: npm install @actions/core@1.6.0 @actions/http-client
      - name: Get Id Token
        uses: actions/github-script@v8
        id: idtoken
        with:
           script: |
               const coredemo = require('@actions/core')
               return await coredemo.getIDToken()
           result-encoding: string
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AMBITIOUS_GROUND_0B36D9710 }}
          action: "close"
          github_id_token: ${{ steps.idtoken.outputs.result }}

  mirror_learn_notes:
    needs: build_and_deploy_job
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    name: Mirror Learn Notes
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # The mirror is optional. Without a LEARN_MIRROR_TOKEN secret this job
      # reports that it is inactive and exits cleanly, so deploys never depend
      # on the notes repo existing.
      - name: Check for mirror token
        id: check
        env:
          MIRROR_TOKEN: ${{ secrets.LEARN_MIRROR_TOKEN }}
        run: |
          if [ -n "$MIRROR_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "LEARN_MIRROR_TOKEN is not set. Skipping the notes mirror."
          fi

      - name: Push learn content to the notes repo
        if: steps.check.outputs.enabled == 'true'
        env:
          MIRROR_TOKEN: ${{ secrets.LEARN_MIRROR_TOKEN }}
          MIRROR_REPO: ${{ vars.LEARN_MIRROR_REPO || 'rlwilliamson-dev/learn-notes' }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${MIRROR_TOKEN}@github.com/${MIRROR_REPO}.git" mirror
          mkdir -p mirror/notes
          rsync -a --delete blog/src/content/learn/ mirror/notes/
          cat > mirror/README.md <<'EOF'
          # learn-notes

          Markdown source for the learning notes published at
          https://rlwilliamson.dev/learn

          This repository is a read-only mirror. It is generated automatically
          from the `blog/src/content/learn` directory of
          https://github.com/rlwilliamson-dev/azure-resume on every deploy.
          Pull requests opened here cannot be merged; open them against the
          source repository instead.
          EOF
          cd mirror
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to mirror."
          else
            git commit -m "sync learn notes from azure-resume@${GITHUB_SHA:0:7}"
            git push
          fi
